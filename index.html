*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
  scroll-padding-top:88px;
}

main section{
  scroll-margin-top:88px;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Manrope',system-ui,-apple-system,sans-serif;
}

.font-display{
  font-family:'Bricolage Grotesque','Manrope',system-ui,sans-serif;
  font-weight:800;
  letter-spacing:-.02em;
}

.text-balance{
  text-wrap:balance;
}

.card-hover{
  transition:transform .25s ease, box-shadow .25s ease;
}

.card-hover:hover{
  transform:translateY(-5px) rotate(-.4deg);
  box-shadow:0 24px 50px rgba(0,0,0,.38);
}

input,select,textarea{
  font-family:inherit;
}

input:focus,select:focus,textarea:focus{
  outline:3px solid var(--yellow);
  outline-offset:2px;
}

::-moz-selection{
  background:#FFC700;
  color:#150E2C;
}

::selection{
  background:#FFC700;
  color:#150E2C;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(14px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.fade-up{
  animation:fadeUp .55s ease both;
}

@keyframes floatSoft{
  0%,100%{
    transform:translateY(0) rotate(-2deg);
  }

  50%{
    transform:translateY(-8px) rotate(1deg);
  }
}

.float-soft{
  animation:floatSoft 5s ease-in-out infinite;
}

@keyframes slideWord{
  0%{
    opacity:0;
    transform:translateY(22px) rotate(1deg);
  }

  12%{
    opacity:1;
    transform:translateY(0);
  }

  82%{
    opacity:1;
    transform:translateY(0);
  }

  100%{
    opacity:0;
    transform:translateY(-18px);
  }
}

.slide-word{
  display:inline-block;
  animation:slideWord 2.2s ease both;
}

@keyframes headerTagline{
  0%{
    opacity:0;
    transform:translateY(8px);
  }

  14%{
    opacity:1;
    transform:translateY(0);
  }

  84%{
    opacity:1;
    transform:translateY(0);
  }

  100%{
    opacity:0;
    transform:translateY(-6px);
  }
}

.header-tagline{
  animation:headerTagline 2.5s ease both;
}

@keyframes marquee{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-50%);
  }
}

.marquee-track{
  animation:marquee 22s linear infinite;
}

@keyframes popIn{
  0%{
    transform:scale(.85);
    opacity:0;
  }

  100%{
    transform:scale(1);
    opacity:1;
  }
}

.pop-in{
  animation:popIn .35s ease both;
}

.wa-track{
  animation:marquee 32s linear infinite;
}

.wa-marquee:hover .wa-track{
  animation-play-state:paused;
}

.font-classic{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-weight:600;
}

.font-cinzel{
  font-family:'Cinzel',Georgia,serif;
  font-weight:600;
}

.classic-badge{
  display:inline-block;
  max-width:100%;
  padding:3px;
  border:1px solid rgba(255,199,0,.85);
  background:linear-gradient(135deg,#0F0A22 0%,#221641 38%,#120B2E 62%,#000000 100%);
  box-shadow:0 0 0 1px rgba(255,199,0,.12),0 0 34px rgba(255,199,0,.18),0 18px 40px rgba(0,0,0,.45),inset 0 0 28px rgba(255,199,0,.08);
}

.classic-badge-inner{
  border:1px solid rgba(255,199,0,.55);
  background:radial-gradient(ellipse at 50% 0%,rgba(255,199,0,.16) 0%,rgba(255,199,0,0) 58%),linear-gradient(180deg,rgba(255,255,255,.045),rgba(0,0,0,.18));
}

.classic-gold-line{
  display:inline-block;
  height:1px;
  width:28px;
  background:linear-gradient(90deg,transparent,#FFC700);
}

.classic-gold-line-right{
  display:inline-block;
  height:1px;
  width:28px;
  background:linear-gradient(90deg,#FFC700,transparent);
}

@keyframes menuFloat{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-2px);
  }
}

@keyframes menuGlow{
  0%,100%{
    box-shadow:0 0 0 0 rgba(255,106,0,.55),0 0 18px rgba(255,106,0,.45);
  }

  50%{
    box-shadow:0 0 0 7px rgba(255,106,0,0),0 0 30px rgba(255,61,129,.70);
  }
}

.menu-live{
  animation:menuFloat 3.2s ease-in-out infinite,menuGlow 2.4s ease-in-out infinite;
}

.menu-live-open{
  animation:menuFloat 3.2s ease-in-out infinite,menuGlow 1.4s ease-in-out infinite;
  filter:brightness(1.12);
}

.menu-line{
  transition:transform .32s ease,opacity .28s ease;
  transform-origin:center;
}

.menu-live:hover .menu-line-top,.menu-live[data-open="true"] .menu-line-top{
  transform:translateY(8px) rotate(45deg);
}

.menu-live:hover .menu-line-middle,.menu-live[data-open="true"] .menu-line-middle{
  transform:scaleX(.35);
  opacity:0;
}

.menu-live:hover .menu-line-bottom,.menu-live[data-open="true"] .menu-line-bottom{
  transform:translateY(-8px) rotate(-45deg);
}

@keyframes menuPanelIn{
  from{
    opacity:0;
    transform:translateY(-10px) scale(.98);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.menu-panel{
  animation:menuPanelIn .18s ease both;
  transform-origin:top right;
}

@media (prefers-reduced-motion: reduce){
  .menu-live,.menu-live-open,.menu-panel{
    animation:none;
